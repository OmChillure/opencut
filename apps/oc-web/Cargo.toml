[package]
name = "oc-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dioxus editor UI"

[dependencies]
dioxus = { workspace = true, features = ["web", "router"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
oc-core = { workspace = true, features = ["gpu"] }
oc-tools.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "Node", "EventTarget", "HtmlElement", "HtmlVideoElement", "HtmlMediaElement", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "AudioContext", "AudioBuffer", "AudioNode", "AudioDestinationNode", "AudioParam", "AnalyserNode", "BiquadFilterNode", "BiquadFilterType", "DynamicsCompressorNode", "GainNode", "StereoPannerNode", "MediaElementAudioSourceNode", "WaveShaperNode", "KeyboardEvent", "PointerEvent", "Storage", "Blob", "BlobPropertyBag", "Url", "DomRect", "Headers", "Request", "RequestInit", "RequestMode", "Response", "ReadableStream", "ReadableStreamDefaultReader", "AbortController", "AbortSignal", "BeforeUnloadEvent", "NodeList"] }
